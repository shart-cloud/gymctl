# Broken starting state for CKS-003.
#
# A stand-in "dashboard" web app (plain nginx — the real subject is the Ingress
# and the RBAC, not the app) exposed through ingress-nginx at
# dashboard.lab.local. Two deliberate flaws:
#   1. The Ingress has NO tls: block — traffic is terminated as plain HTTP.
#   2. The pod's ServiceAccount is bound to cluster-admin, so popping the pod
#      hands an attacker the entire cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: kubernetes-dashboard
  labels:
    kubernetes.io/metadata.name: kubernetes-dashboard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard
  namespace: kubernetes-dashboard
---
# The vulnerability: the dashboard SA can do anything, anywhere.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard-cluster-admin
subjects:
  - kind: ServiceAccount
    name: dashboard
    namespace: kubernetes-dashboard
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: kubernetes-dashboard
  labels:
    app: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      serviceAccountName: dashboard
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: kubernetes-dashboard
spec:
  selector:
    app: dashboard
  ports:
    - port: 80
      targetPort: 80
---
# Ingress with NO tls: block — dashboard.lab.local is served over plain HTTP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard
  namespace: kubernetes-dashboard
spec:
  ingressClassName: nginx
  rules:
    - host: dashboard.lab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 80
