# TLS material for dashboard.lab.local — a committed, pre-generated self-signed
# cert so `kubectl apply -f solution/` is fully self-contained (no openssl step
# needed to reach 100%). It is a type: kubernetes.io/tls Secret; ingress-nginx
# reads tls.crt / tls.key from it to terminate HTTPS for the host.
#
# To regenerate it yourself instead of using this one:
#   openssl req -x509 -nodes -newkey rsa:2048 -keyout tls.key -out tls.crt \
#     -days 3650 -subj "/CN=dashboard.lab.local/O=gymctl-lab" \
#     -addext "subjectAltName=DNS:dashboard.lab.local"
#   kubectl create secret tls dashboard-tls -n kubernetes-dashboard \
#     --cert=tls.crt --key=tls.key
#
# The cert's CN and SubjectAltName are dashboard.lab.local — a check decodes
# tls.crt and asserts that, so a cert for the wrong host will not pass.
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-tls
  namespace: kubernetes-dashboard
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
