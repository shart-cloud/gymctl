apiVersion: gym.jerry.io/v1
kind: Exercise

metadata:
  name: cks-016-pod-security-admission
  title: "CKS-016 - Pod Security Admission"
  track: cks
  week: 12
  order: 16

spec:
  difficulty: beginner
  estimatedTime: 25m
  points: 100
  implementationStatus: scaffold

  description: |
    Label `restricted-apps` to enforce restricted, label `baseline-apps` to enforce baseline and warn restricted, verify a root pod is rejected in restricted, warn-only behavior in baseline, and a compliant restricted pod runs.

  learningOutcomes:
    - "Practice CKS domain: Minimize Microservice Vulnerabilities"
    - "Apply concepts: Pod Security Standards, Pod Security Admission, enforce/warn/audit labels"
    - "Validate the fix with kubectl and security-focused checks"

  tags:
    - "cks"
    - "cks-minimize-microservice-vulnerabilities"
    - "tier-1"
    - "kind"
    - "pod-security-standards"
    - "pod-security-admission"
    - "enforce-warn-audit-labels"


  environment:
    type: kubernetes
    kubernetes:
      provider: kind
      createCluster: true
      namespace: default

  checks:
    - name: "Executable lab checks implemented"
      type: script
      script: |
        echo "CKS-016 is scaffolded from the CKS track specification." >&2
        echo "Implement setup manifests/scripts and executable checks before enabling completion." >&2
        echo "Planned check criteria:" >&2
        cat >&2 <<'CRITERIA'
        - restricted-apps enforces restricted
        - baseline-apps enforces baseline and warns restricted
        - Root pod rejected in restricted-apps
        - Root pod admitted with warning in baseline-apps
        - Compliant pod runs in restricted-apps
        CRITERIA
        exit 1
      expectExitCode: 0

  hints:
    - cost: 0
      file: hints/hint-1.md
    - cost: 25
      file: hints/hint-2.md
    - cost: 50
      file: hints/hint-3.md

  successMessage: |
    CKS-016 complete. You remediated the target CKS scenario and verified the controls.

  tasking:
    ticket: "CKS-016"
    priority: "P1"
    summary: "Pod Security Admission"
    description: "Scaffolded CKS exercise for Minimize Microservice Vulnerabilities using kind infrastructure."
    reporter: "GRIM-9"

  jerryDialog:
    onStart: "Jerry left a CKS-shaped security incident here. The exam prompt is clean; the mess is not."
    onCheckFail: "The scaffold is loaded, but the executable lab still needs real setup and checks."
    onComplete: "Security control verified. Jerry has fewer sharp objects now."
