apiVersion: gym.jerry.io/v1
kind: Exercise

metadata:
  name: cks-021-manifest-static-analysis-pipeline
  title: "CKS-021 - Manifest Static Analysis Pipeline"
  track: cks
  week: 12
  order: 21

spec:
  difficulty: intermediate
  estimatedTime: 35m
  points: 140
  implementationStatus: scaffold

  description: |
    Run kubesec and kube-linter against `/root/manifests/`, save outputs, fix all CRITICAL/HIGH issues, re-run tools, apply fixed manifests to `staging`, and verify workloads run.

  learningOutcomes:
    - "Practice CKS domain: Supply Chain Security"
    - "Apply concepts: kubesec, kube-linter, static analysis, shift-left security"
    - "Validate the fix with kubectl and security-focused checks"

  tags:
    - "cks"
    - "cks-supply-chain-security"
    - "tier-2"
    - "kind"
    - "kubesec"
    - "kube-linter"
    - "static-analysis"
    - "shift-left-security"


  environment:
    type: kubernetes
    kubernetes:
      provider: kind
      createCluster: true
      namespace: default

  checks:
    - name: "Executable lab checks implemented"
      type: script
      script: |
        echo "CKS-021 is scaffolded from the CKS track specification." >&2
        echo "Implement setup manifests/scripts and executable checks before enabling completion." >&2
        echo "Planned check criteria:" >&2
        cat >&2 <<'CRITERIA'
        - Analysis outputs exist
        - Fixed manifests address CRITICAL/HIGH findings
        - Re-scan shows no CRITICAL/HIGH issues
        - All workloads run in staging
        CRITERIA
        exit 1
      expectExitCode: 0

  hints:
    - cost: 0
      file: hints/hint-1.md
    - cost: 25
      file: hints/hint-2.md
    - cost: 50
      file: hints/hint-3.md

  successMessage: |
    CKS-021 complete. You remediated the target CKS scenario and verified the controls.

  jerryDialog:
    onStart: "Jerry left a CKS-shaped security incident here. The exam prompt is clean; the mess is not."
    onCheckFail: "The scaffold is loaded, but the executable lab still needs real setup and checks."
    onComplete: "Security control verified. Jerry has fewer sharp objects now."
