# HARDENED web workload.
#
# Every kubesec CRITICAL / kube-linter finding on the broken manifest is closed:
#   - runs as non-root (uid 101, the nginx-unprivileged user)
#   - readOnlyRootFilesystem: true, with emptyDir mounts for the paths nginx
#     must still write to (the "trap": a read-only rootfs breaks nginx unless
#     you give it writable temp/cache/pid dirs)
#   - drops ALL capabilities, no privilege escalation, not privileged
#   - CPU + memory requests and limits set
#   - no host namespaces / hostPath
#   - pinned image tag (not :latest)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: staging
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
