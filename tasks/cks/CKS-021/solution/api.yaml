# HARDENED api workload.
#
# The host-access blast radius is gone and the container is locked down:
#   - no hostNetwork / hostPID / hostIPC, no hostPath volume
#   - runs as non-root (uid 1000), readOnlyRootFilesystem: true
#     (a `sleep` process needs nothing writable, so no emptyDir required here)
#   - drops ALL capabilities, no privilege escalation, not privileged
#   - CPU + memory requests and limits set
#   - pinned image tag (not :latest)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: staging
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
