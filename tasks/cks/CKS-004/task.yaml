apiVersion: gym.jerry.io/v1
kind: Exercise

metadata:
  name: cks-004-binary-verification-cluster-integrity
  title: "CKS-004 - Binary Verification and Cluster Integrity"
  track: cks
  week: 12
  order: 4

spec:
  difficulty: beginner
  estimatedTime: 25m
  points: 100
  implementationStatus: scaffold

  description: |
    Verify `/usr/bin/kubelet` and `/usr/bin/kubectl` against `/root/checksums/SHA512SUMS`. Write `/root/binary-verification.txt` with computed and expected hashes, replace any tampered binary from the official Kubernetes release, and restart affected services.

  learningOutcomes:
    - "Practice CKS domain: Cluster Setup"
    - "Apply concepts: SHA-512 checksums, binary verification, tamper detection"
    - "Validate the fix with kubectl and security-focused checks"

  tags:
    - "cks"
    - "cks-cluster-setup"
    - "tier-1"
    - "vagrant"
    - "sha-512-checksums"
    - "binary-verification"
    - "tamper-detection"


  environment:
    type: kubernetes
    kubernetes:
      provider: vagrant
      createCluster: true
      namespace: default
      vagrant:
        bootstrapMode: managed
        box: bento/ubuntu-22.04
        kubernetesVersion: v1.35
        topology:
          controlPlanes: 1
          workers: 2
        network:
          privateCidr: 192.168.56.0/24
        resources:
          controlPlane:
            cpus: 2
            memoryMb: 4096
          worker:
            cpus: 2
            memoryMb: 3072

  checks:
    - name: "Executable lab checks implemented"
      type: script
      script: |
        echo "CKS-004 is scaffolded from the CKS track specification." >&2
        echo "Implement setup manifests/scripts and executable checks before enabling completion." >&2
        echo "Planned check criteria:" >&2
        cat >&2 <<'CRITERIA'
        - binary-verification.txt exists with required fields
        - kubelet and kubectl match official checksums or have been replaced
        - Kubelet is running if replaced
        CRITERIA
        exit 1
      expectExitCode: 0

  hints:
    - cost: 0
      file: hints/hint-1.md
    - cost: 25
      file: hints/hint-2.md
    - cost: 50
      file: hints/hint-3.md

  successMessage: |
    CKS-004 complete. You remediated the target CKS scenario and verified the controls.

  jerryDialog:
    onStart: "Jerry left a CKS-shaped security incident here. The exam prompt is clean; the mess is not."
    onCheckFail: "The scaffold is loaded, but the executable lab still needs real setup and checks."
    onComplete: "Security control verified. Jerry has fewer sharp objects now."
