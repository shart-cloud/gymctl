apiVersion: gym.jerry.io/v1
kind: Exercise

metadata:
  name: cks-024-immutable-container-enforcement
  title: "CKS-024 - Immutable Container Enforcement"
  track: cks
  week: 12
  order: 24

spec:
  difficulty: beginner
  estimatedTime: 25m
  points: 100
  implementationStatus: scaffold

  description: |
    Harden `production` Deployments `web`, `api`, and `cache` with read-only root filesystems, emptyDir mounts for app write paths, and no privilege escalation. Verify pods run and only designated write paths are writable.

  learningOutcomes:
    - "Practice CKS domain: Monitoring, Logging & Runtime Security"
    - "Apply concepts: readOnlyRootFilesystem, emptyDir write paths, immutable containers"
    - "Validate the fix with kubectl and security-focused checks"

  tags:
    - "cks"
    - "cks-monitoring-logging-runtime-security"
    - "tier-1"
    - "kind"
    - "readonlyrootfilesystem"
    - "emptydir-write-paths"
    - "immutable-containers"


  environment:
    type: kubernetes
    kubernetes:
      provider: kind
      createCluster: true
      namespace: default

  checks:
    - name: "Executable lab checks implemented"
      type: script
      script: |
        echo "CKS-024 is scaffolded from the CKS track specification." >&2
        echo "Implement setup manifests/scripts and executable checks before enabling completion." >&2
        echo "Planned check criteria:" >&2
        cat >&2 <<'CRITERIA'
        - All three deployments have readOnlyRootFilesystem=true
        - Each has emptyDir volumes for write paths
        - allowPrivilegeEscalation=false
        - All pods Running
        - Writes to /etc or /usr fail and designated dirs succeed
        CRITERIA
        exit 1
      expectExitCode: 0

  hints:
    - cost: 0
      file: hints/hint-1.md
    - cost: 25
      file: hints/hint-2.md
    - cost: 50
      file: hints/hint-3.md

  successMessage: |
    CKS-024 complete. You remediated the target CKS scenario and verified the controls.

  tasking:
    ticket: "CKS-024"
    priority: "P1"
    summary: "Immutable Container Enforcement"
    description: "Scaffolded CKS exercise for Monitoring, Logging & Runtime Security using kind infrastructure."
    reporter: "GRIM-9"

  jerryDialog:
    onStart: "Jerry left a CKS-shaped security incident here. The exam prompt is clean; the mess is not."
    onCheckFail: "The scaffold is loaded, but the executable lab still needs real setup and checks."
    onComplete: "Security control verified. Jerry has fewer sharp objects now."
