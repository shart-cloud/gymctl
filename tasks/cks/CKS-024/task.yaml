apiVersion: gym.jerry.io/v1
kind: Exercise

metadata:
  name: cks-024-immutable-container-enforcement
  title: "CKS-024 - Immutable Container Enforcement"
  track: cks
  week: 12
  order: 24

spec:
  difficulty: intermediate
  estimatedTime: 25m
  points: 100
  implementationStatus: ready

  description: |
    Three deployments in `production` — `web`, `api`, and `cache` — run with
    writable root filesystems. An attacker who lands in any of them can drop a
    binary, patch a config, or persist. Make the containers immutable.

    For all three deployments:

      - Set `readOnlyRootFilesystem: true` on the container.
      - Set `allowPrivilegeEscalation: false` on the container.
      - Mount an `emptyDir` at `/tmp` so the app keeps a writable scratch path
        under the now read-only root.

    Every deployment must stay Available: writes to the image (e.g. `/etc`,
    `/usr`) must fail, but writes to `/tmp` must succeed.

  learningOutcomes:
    - "CKS domain: Minimize Microservice Vulnerabilities — immutability"
    - "Make container root filesystems read-only at scale"
    - "Supply writable scratch space with emptyDir"
    - "Disable privilege escalation across a fleet of deployments"

  tags:
    - "cks"
    - "cks-microservice-vulnerabilities"
    - "tier-1"
    - "kind"
    - "readonly-rootfs"
    - "immutable-containers"

  environment:
    type: kubernetes
    kubernetes:
      provider: kind
      createCluster: true
      namespace: production
    customSetup:
      - type: script
        timeout: 150s
        script: |
          set -euo pipefail
          kubectl apply -f setup/workloads.yaml
          kubectl -n production rollout status deploy/web   --timeout=120s
          kubectl -n production rollout status deploy/api   --timeout=120s
          kubectl -n production rollout status deploy/cache --timeout=120s

  checks:
    - name: "all three deployments set readOnlyRootFilesystem=true"
      type: script
      script: |
        set -euo pipefail
        for d in web api cache; do
          v=$(kubectl -n production get deploy "$d" -o jsonpath='{.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem}')
          [ "$v" = "true" ] || { echo "$d readOnlyRootFilesystem=$v (want true)"; exit 1; }
        done
        echo "web, api, cache all read-only"

    - name: "all three deployments disable privilege escalation"
      type: script
      script: |
        set -euo pipefail
        for d in web api cache; do
          v=$(kubectl -n production get deploy "$d" -o jsonpath='{.spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation}')
          [ "$v" = "false" ] || { echo "$d allowPrivilegeEscalation=$v (want false)"; exit 1; }
        done
        echo "web, api, cache all block privilege escalation"

    - name: "all three deployments mount an emptyDir volume"
      type: script
      script: |
        set -euo pipefail
        for d in web api cache; do
          v=$(kubectl -n production get deploy "$d" -o jsonpath='{.spec.template.spec.volumes[*].emptyDir}')
          [ -n "$v" ] || { echo "$d has no emptyDir volume"; exit 1; }
        done
        echo "web, api, cache all have an emptyDir"

    - name: "all three deployments are Available"
      type: script
      script: |
        set -euo pipefail
        for d in web api cache; do
          kubectl -n production rollout status deploy/"$d" --timeout=90s >/dev/null
        done
        echo "web, api, cache all Available"

    - name: "root filesystem is truly read-only, scratch dir writable"
      type: script
      script: |
        set -uo pipefail
        for d in web api cache; do
          kubectl -n production exec deploy/"$d" -- sh -c 'echo ok > /tmp/probe' || { echo "$d cannot write /tmp"; exit 1; }
          if kubectl -n production exec deploy/"$d" -- sh -c 'echo x > /etc/probe' 2>/dev/null; then
            echo "$d wrote to /etc — root filesystem is NOT read-only"; exit 1
          fi
        done
        echo "web, api, cache: image read-only, /tmp writable"

  hints:
    - cost: 0
      file: hints/hint-1.md
    - cost: 25
      file: hints/hint-2.md
    - cost: 50
      file: hints/hint-3.md

  successMessage: |
    CKS-024 complete. web, api, and cache now run on immutable root filesystems
    with privilege escalation disabled, and still serve because /tmp is a
    writable emptyDir.

    **Key takeaway:** `readOnlyRootFilesystem: true` is one of the highest-value,
    lowest-cost container hardening settings. The only work is finding the paths
    the app writes to and backing them with emptyDir volumes.

  references:
    - title: "Configure a Security Context for a Pod or Container"
      url: "https://kubernetes.io/docs/tasks/configure-pod-container/security-context/"

  jerryDialog:
    onStart: "Jerry's production containers all have writable disks. An attacker can rewrite them from the inside. Make them immutable."
    onCheckFail: "Not immutable yet, or you made one so immutable it can't start. All three have to be read-only AND Available."
    onComplete: "All three are immutable now. Nothing an attacker drops inside survives a restart, and they can't patch the image at runtime."
