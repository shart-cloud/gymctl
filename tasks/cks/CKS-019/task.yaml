apiVersion: gym.jerry.io/v1
kind: Exercise

metadata:
  name: cks-019-dockerfile-security-audit
  title: "CKS-019 - Dockerfile Security Audit"
  track: cks
  week: 12
  order: 19

spec:
  difficulty: intermediate
  estimatedTime: 35m
  points: 140
  implementationStatus: scaffold

  description: |
    Audit three Dockerfiles under `/root/dockerfiles/` with hadolint and manual checks, write corrected `<name>.fixed` files, build each fixed image, and verify they work.

  learningOutcomes:
    - "Practice CKS domain: Supply Chain Security"
    - "Apply concepts: Dockerfile best practices, security anti-patterns, hadolint"
    - "Validate the fix with kubectl and security-focused checks"

  tags:
    - "cks"
    - "cks-supply-chain-security"
    - "tier-2"
    - "kind"
    - "dockerfile-best-practices"
    - "security-anti-patterns"
    - "hadolint"


  environment:
    type: kubernetes
    kubernetes:
      provider: kind
      createCluster: true
      namespace: default

  checks:
    - name: "Executable lab checks implemented"
      type: script
      script: |
        echo "CKS-019 is scaffolded from the CKS track specification." >&2
        echo "Implement setup manifests/scripts and executable checks before enabling completion." >&2
        echo "Planned check criteria:" >&2
        cat >&2 <<'CRITERIA'
        - Hadolint output files exist
        - Fixed Dockerfiles address findings
        - No secrets in build layers
        - All images specify non-root USER
        - Base images use specific tags
        - Fixed Dockerfiles build successfully
        CRITERIA
        exit 1
      expectExitCode: 0

  hints:
    - cost: 0
      file: hints/hint-1.md
    - cost: 25
      file: hints/hint-2.md
    - cost: 50
      file: hints/hint-3.md

  successMessage: |
    CKS-019 complete. You remediated the target CKS scenario and verified the controls.

  jerryDialog:
    onStart: "Jerry left a CKS-shaped security incident here. The exam prompt is clean; the mess is not."
    onCheckFail: "The scaffold is loaded, but the executable lab still needs real setup and checks."
    onComplete: "Security control verified. Jerry has fewer sharp objects now."
