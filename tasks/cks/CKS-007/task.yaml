apiVersion: gym.jerry.io/v1
kind: Exercise

metadata:
  name: cks-007-api-server-access-restriction
  title: "CKS-007 - API Server Access Restriction"
  track: cks
  week: 12
  order: 7

spec:
  difficulty: intermediate
  estimatedTime: 35m
  points: 140
  implementationStatus: scaffold

  description: |
    Review the API server static pod manifest. Disable anonymous auth, enable NodeRestriction and PodSecurity, configure kubelet CA, require TLS 1.2+, and remove or disable insecure-port. Verify the cluster remains healthy.

  learningOutcomes:
    - "Practice CKS domain: Cluster Hardening"
    - "Apply concepts: API server flags, admission controllers, NodeRestriction, PodSecurity, TLS hardening"
    - "Validate the fix with kubectl and security-focused checks"

  tags:
    - "cks"
    - "cks-cluster-hardening"
    - "tier-2"
    - "vagrant"
    - "api-server-flags"
    - "admission-controllers"
    - "noderestriction"
    - "podsecurity"


  environment:
    type: kubernetes
    kubernetes:
      provider: vagrant
      createCluster: true
      namespace: default
      vagrant:
        bootstrapMode: managed
        box: bento/ubuntu-22.04
        kubernetesVersion: v1.35
        topology:
          controlPlanes: 1
          workers: 2
        network:
          privateCidr: 192.168.56.0/24
        resources:
          controlPlane:
            cpus: 2
            memoryMb: 4096
          worker:
            cpus: 2
            memoryMb: 3072

  checks:
    - name: "Executable lab checks implemented"
      type: script
      script: |
        echo "CKS-007 is scaffolded from the CKS track specification." >&2
        echo "Implement setup manifests/scripts and executable checks before enabling completion." >&2
        echo "Planned check criteria:" >&2
        cat >&2 <<'CRITERIA'
        - anonymous-auth=false
        - enable-admission-plugins includes NodeRestriction and PodSecurity
        - kubelet-certificate-authority points to CA
        - tls-min-version=VersionTLS12
        - insecure-port absent or 0
        - API server is running and kubectl works
        CRITERIA
        exit 1
      expectExitCode: 0

  hints:
    - cost: 0
      file: hints/hint-1.md
    - cost: 25
      file: hints/hint-2.md
    - cost: 50
      file: hints/hint-3.md

  successMessage: |
    CKS-007 complete. You remediated the target CKS scenario and verified the controls.

  jerryDialog:
    onStart: "Jerry left a CKS-shaped security incident here. The exam prompt is clean; the mess is not."
    onCheckFail: "The scaffold is loaded, but the executable lab still needs real setup and checks."
    onComplete: "Security control verified. Jerry has fewer sharp objects now."
