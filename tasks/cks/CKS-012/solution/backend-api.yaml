apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: app
  labels: { app: backend-api }
spec:
  replicas: 1
  selector: { matchLabels: { app: backend-api } }
  template:
    metadata:
      labels: { app: backend-api }
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c", "sleep 36000"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
