apiVersion: gym.jerry.io/v1
kind: Exercise

metadata:
  name: cks-025-incident-response-cluster-compromise-investigation
  title: "CKS-025 - Incident Response - Cluster Compromise Investigation"
  track: cks
  week: 12
  order: 25

spec:
  difficulty: advanced
  estimatedTime: 50m
  points: 200
  implementationStatus: scaffold

  description: |
    Investigate anomalous activity using `/var/log/kubernetes/audit.log` and `/var/log/falco/alerts.json`. Identify the compromised ServiceAccount, build a timeline, find and delete the rogue pod, document Falco findings, revoke permissions, rotate accessed Secrets, isolate the namespace, and write remediation notes.

  learningOutcomes:
    - "Practice CKS domain: Monitoring, Logging & Runtime Security"
    - "Apply concepts: audit log analysis, Falco alerts, RBAC review, container forensics, remediation"
    - "Validate the fix with kubectl and security-focused checks"

  tags:
    - "cks"
    - "cks-monitoring-logging-runtime-security"
    - "tier-3"
    - "vagrant"
    - "audit-log-analysis"
    - "falco-alerts"
    - "rbac-review"
    - "container-forensics"


  environment:
    type: kubernetes
    kubernetes:
      provider: vagrant
      createCluster: true
      namespace: default
      vagrant:
        bootstrapMode: managed
        box: bento/ubuntu-22.04
        kubernetesVersion: v1.35
        topology:
          controlPlanes: 1
          workers: 2
        network:
          privateCidr: 192.168.56.0/24
        resources:
          controlPlane:
            cpus: 2
            memoryMb: 4096
          worker:
            cpus: 2
            memoryMb: 3072

  checks:
    - name: "Executable lab checks implemented"
      type: script
      script: |
        echo "CKS-025 is scaffolded from the CKS track specification." >&2
        echo "Implement setup manifests/scripts and executable checks before enabling completion." >&2
        echo "Planned check criteria:" >&2
        cat >&2 <<'CRITERIA'
        - Compromised ServiceAccount correctly identified
        - Timeline has at least 5 chronological events
        - Rogue pod identified and deleted
        - Falco findings documented
        - Compromised permissions revoked
        - Old secrets deleted and new ones created
        - NetworkPolicy isolates affected namespace
        - Remediation report is actionable
        CRITERIA
        exit 1
      expectExitCode: 0

  hints:
    - cost: 0
      file: hints/hint-1.md
    - cost: 25
      file: hints/hint-2.md
    - cost: 50
      file: hints/hint-3.md

  successMessage: |
    CKS-025 complete. You remediated the target CKS scenario and verified the controls.

  tasking:
    ticket: "CKS-025"
    priority: "P0"
    summary: "Incident Response - Cluster Compromise Investigation"
    description: "Scaffolded CKS exercise for Monitoring, Logging & Runtime Security using vm infrastructure."
    reporter: "GRIM-9"

  jerryDialog:
    onStart: "Jerry left a CKS-shaped security incident here. The exam prompt is clean; the mess is not."
    onCheckFail: "The scaffold is loaded, but the executable lab still needs real setup and checks."
    onComplete: "Security control verified. Jerry has fewer sharp objects now."
