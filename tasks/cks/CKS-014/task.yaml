apiVersion: gym.jerry.io/v1
kind: Exercise

metadata:
  name: cks-014-secrets-management-encryption-at-rest
  title: "CKS-014 - Secrets Management and Encryption at Rest"
  track: cks
  week: 12
  order: 14

spec:
  difficulty: intermediate
  estimatedTime: 35m
  points: 140
  implementationStatus: scaffold

  description: |
    Find hardcoded backend credentials, move them into `db-credentials`, update Deployment and CronJob consumers, delete plaintext ConfigMap, configure Secrets encryption at rest with aescbc, re-encrypt existing Secrets, and verify encrypted etcd storage.

  learningOutcomes:
    - "Practice CKS domain: Minimize Microservice Vulnerabilities"
    - "Apply concepts: Kubernetes Secrets, encryption at rest, EncryptionConfiguration, etcd"
    - "Validate the fix with kubectl and security-focused checks"

  tags:
    - "cks"
    - "cks-minimize-microservice-vulnerabilities"
    - "tier-2"
    - "vagrant"
    - "kubernetes-secrets"
    - "encryption-at-rest"
    - "encryptionconfiguration"
    - "etcd"


  environment:
    type: kubernetes
    kubernetes:
      provider: vagrant
      createCluster: true
      namespace: default
      vagrant:
        bootstrapMode: managed
        box: bento/ubuntu-22.04
        kubernetesVersion: v1.35
        topology:
          controlPlanes: 1
          workers: 2
        network:
          privateCidr: 192.168.56.0/24
        resources:
          controlPlane:
            cpus: 2
            memoryMb: 4096
          worker:
            cpus: 2
            memoryMb: 3072

  checks:
    - name: "Executable lab checks implemented"
      type: script
      script: |
        echo "CKS-014 is scaffolded from the CKS track specification." >&2
        echo "Implement setup manifests/scripts and executable checks before enabling completion." >&2
        echo "Planned check criteria:" >&2
        cat >&2 <<'CRITERIA'
        - No backend ConfigMap contains passwords
        - db-credentials Secret exists with correct data
        - api-server uses secretKeyRef
        - db-backup mounts Secret and has no password args
        - API server references EncryptionConfiguration
        - aescbc key is correct
        - API server healthy and etcd data is encrypted
        CRITERIA
        exit 1
      expectExitCode: 0

  hints:
    - cost: 0
      file: hints/hint-1.md
    - cost: 25
      file: hints/hint-2.md
    - cost: 50
      file: hints/hint-3.md

  successMessage: |
    CKS-014 complete. You remediated the target CKS scenario and verified the controls.

  jerryDialog:
    onStart: "Jerry left a CKS-shaped security incident here. The exam prompt is clean; the mess is not."
    onCheckFail: "The scaffold is loaded, but the executable lab still needs real setup and checks."
    onComplete: "Security control verified. Jerry has fewer sharp objects now."
