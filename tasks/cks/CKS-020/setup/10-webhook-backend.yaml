# The admission BACKEND the learner does NOT write — it ships pre-built and must
# be live and deterministic, because the learner's ValidatingWebhookConfiguration
# uses failurePolicy: Fail. If this backend were unreachable, or its serving cert
# did not match the caBundle in the webhook config, EVERY pod create in a
# non-excluded namespace would be blocked (fail-closed) — including the "trusted"
# ones — and the exercise would be unsolvable.
#
# It runs on a STOCK image (python:3.12-alpine) pulled at runtime, executing an
# AdmissionReview server whose code is mounted from a ConfigMap and whose TLS
# cert/key are mounted from a Secret. Nothing is `docker build`-ed, so it does
# not couple to the kind cluster's name.
#
# The cert/key below are FIXED, pre-generated THROWAWAY lab certs. The server
# cert carries subjectAltName DNS:image-policy.policy-system.svc (+ .cluster.local),
# and its CA's base64 is embedded as the static caBundle in solution/. Committing
# these training certs is intentional — it is what makes the webhook deterministic.
---
apiVersion: v1
kind: Secret
metadata:
  name: image-policy-tls
  namespace: policy-system
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: image-policy-code
  namespace: policy-system
data:
  webhook.py: |
    #!/usr/bin/env python3
    # Image-admission AdmissionReview backend.
    #
    # Policy enforced on every container/initContainer/ephemeralContainer image:
    #   1. DENY the ':latest' tag or an untagged image (no explicit tag).
    #   2. DENY any image whose registry is not in TRUSTED_REGISTRIES
    #      (implicit Docker Hub images like 'nginx:1.27' resolve to docker.io).
    #   3. ALLOW only trusted-registry images carrying an explicit, non-latest tag.
    #
    # Fails SAFE: any parse error denies with a message, so tests stay meaningful.
    import json
    import ssl
    import sys
    from http.server import BaseHTTPRequestHandler, HTTPServer

    TRUSTED_REGISTRIES = ("registry.k8s.io",)

    def parse_image(image):
        # -> (registry, tag_or_None)
        ref = image.split("@", 1)[0]  # drop any digest
        head, _, rest = ref.partition("/")
        if rest and ("." in head or ":" in head or head == "localhost"):
            registry, remainder = head, rest
        else:
            registry, remainder = "docker.io", ref
        last = remainder.rsplit("/", 1)[-1]
        tag = last.rsplit(":", 1)[1] if ":" in last else None
        return registry, tag

    def evaluate(pod):
        spec = pod.get("spec", {}) or {}
        containers = []
        for key in ("containers", "initContainers", "ephemeralContainers"):
            containers.extend(spec.get(key) or [])
        if not containers:
            return True, "no containers to evaluate"
        for c in containers:
            image = c.get("image", "") or ""
            registry, tag = parse_image(image)
            if tag is None or tag == "latest":
                return False, ("image '%s' uses the 'latest' tag or no tag; "
                               "an explicit non-latest tag is required" % image)
            if registry not in TRUSTED_REGISTRIES:
                return False, ("image '%s' comes from untrusted registry '%s'; "
                               "only %s is trusted" %
                               (image, registry, ", ".join(TRUSTED_REGISTRIES)))
        return True, "all images use a trusted registry with an explicit non-latest tag"

    class Handler(BaseHTTPRequestHandler):
        def _respond(self, uid, allowed, message):
            review = {
                "apiVersion": "admission.k8s.io/v1",
                "kind": "AdmissionReview",
                "response": {
                    "uid": uid,
                    "allowed": allowed,
                    "status": {"code": 200 if allowed else 403, "message": message},
                },
            }
            body = json.dumps(review).encode("utf-8")
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)
            sys.stdout.write("[image-policy] uid=%s %s: %s\n" %
                             (uid, "ALLOW" if allowed else "DENY", message))
            sys.stdout.flush()

        def do_POST(self):
            try:
                length = int(self.headers.get("Content-Length", 0))
                review = json.loads(self.rfile.read(length))
                req = review.get("request", {}) or {}
                uid = req.get("uid", "")
                obj = req.get("object", {}) or {}
                allowed, message = evaluate(obj)
                self._respond(uid, allowed, message)
            except Exception as exc:  # fail safe: deny on parse failure
                try:
                    self._respond("", False,
                                  "image-policy could not parse AdmissionReview: %s" % exc)
                except Exception:
                    pass

        def do_GET(self):  # trivial liveness endpoint
            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"ok")

        def log_message(self, *args):  # silence default access logging
            return

    def main():
        ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
        ctx.load_cert_chain(certfile="/tls/tls.crt", keyfile="/tls/tls.key")
        httpd = HTTPServer(("0.0.0.0", 8443), Handler)
        httpd.socket = ctx.wrap_socket(httpd.socket, server_side=True)
        sys.stdout.write("[image-policy] serving HTTPS on :8443\n")
        sys.stdout.flush()
        httpd.serve_forever()

    if __name__ == "__main__":
        main()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-policy
  namespace: policy-system
  labels:
    app: image-policy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-policy
  template:
    metadata:
      labels:
        app: image-policy
    spec:
      containers:
        - name: webhook
          image: python:3.12-alpine
          command: ["python3", "/app/webhook.py"]
          ports:
            - containerPort: 8443
              name: https
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: code
          configMap:
            name: image-policy-code
        - name: tls
          secret:
            secretName: image-policy-tls
---
apiVersion: v1
kind: Service
metadata:
  name: image-policy
  namespace: policy-system
spec:
  selector:
    app: image-policy
  ports:
    - name: https
      port: 8443
      targetPort: 8443
