apiVersion: gym.jerry.io/v1
kind: Exercise

metadata:
  name: cks-020-image-admission-validating-webhook
  title: "CKS-020 - Image Admission with Validating Webhook"
  track: cks
  week: 12
  order: 20

spec:
  difficulty: advanced
  estimatedTime: 50m
  points: 200
  implementationStatus: scaffold

  description: |
    Create `image-policy-webhook` pointing to the admission service at `image-policy.policy-system.svc:8443`, with CA bundle, CREATE/UPDATE pod coverage, namespace exclusions, and failurePolicy Fail. Verify untrusted images and latest tags are rejected and trusted explicit tags succeed.

  learningOutcomes:
    - "Practice CKS domain: Supply Chain Security"
    - "Apply concepts: ValidatingWebhookConfiguration, image policy, trusted registries"
    - "Validate the fix with kubectl and security-focused checks"

  tags:
    - "cks"
    - "cks-supply-chain-security"
    - "tier-3"
    - "kind"
    - "validatingwebhookconfiguration"
    - "image-policy"
    - "trusted-registries"


  environment:
    type: kubernetes
    kubernetes:
      provider: kind
      createCluster: true
      namespace: default

  checks:
    - name: "Executable lab checks implemented"
      type: script
      script: |
        echo "CKS-020 is scaffolded from the CKS track specification." >&2
        echo "Implement setup manifests/scripts and executable checks before enabling completion." >&2
        echo "Planned check criteria:" >&2
        cat >&2 <<'CRITERIA'
        - ValidatingWebhookConfiguration exists
        - Webhook targets CREATE/UPDATE pods
        - CA bundle is set
        - namespaceSelector excludes kube-system and policy-system
        - failurePolicy is Fail
        - Docker Hub image rejected
        - Trusted explicit tag succeeds
        - latest tag rejected
        CRITERIA
        exit 1
      expectExitCode: 0

  hints:
    - cost: 0
      file: hints/hint-1.md
    - cost: 25
      file: hints/hint-2.md
    - cost: 50
      file: hints/hint-3.md

  successMessage: |
    CKS-020 complete. You remediated the target CKS scenario and verified the controls.

  tasking:
    ticket: "CKS-020"
    priority: "P0"
    summary: "Image Admission with Validating Webhook"
    description: "Scaffolded CKS exercise for Supply Chain Security using kind infrastructure."
    reporter: "GRIM-9"

  jerryDialog:
    onStart: "Jerry left a CKS-shaped security incident here. The exam prompt is clean; the mess is not."
    onCheckFail: "The scaffold is loaded, but the executable lab still needs real setup and checks."
    onComplete: "Security control verified. Jerry has fewer sharp objects now."
