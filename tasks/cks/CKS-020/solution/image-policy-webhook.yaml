# The one object the learner authors. It wires the cluster's admission chain to
# the pre-built backend Service (policy-system/image-policy) and enforces the
# trusted-image policy on pod CREATE and UPDATE.
#
# apply with:  kubectl apply -f solution/
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: image-policy-webhook
webhooks:
  - name: image-policy.policy-system.svc
    # v1 is the only AdmissionReview version the backend speaks.
    admissionReviewVersions: ["v1"]
    # The backend has no side effects (it only reads and decides), so dry-run is safe.
    sideEffects: None
    # Fail CLOSED: if the backend is unreachable or the caBundle does not match the
    # serving cert, admission is DENIED. Safe here only because the backend is live
    # and policy-system is excluded (so the webhook can never block its own backend).
    failurePolicy: Fail
    # Only pod CREATE and UPDATE are validated. Matching the backend's remit keeps
    # the blast radius tight and avoids validating unrelated resources.
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
        scope: "Namespaced"
    clientConfig:
      service:
        namespace: policy-system
        name: image-policy
        path: /validate
        port: 8443
      # Static CA of the fixed lab certs. MUST match the CA that signed the
      # backend's serving cert (the tls.crt in setup/), or the TLS handshake fails
      # and — under failurePolicy: Fail — every pod create is blocked.
      caBundle: 
    # Exclude kube-system (control-plane pods) AND policy-system (the backend
    # itself). Excluding policy-system prevents a deadlock: if the webhook vetted
    # its own backend's pods and the backend were down, failurePolicy: Fail would
    # block the backend from ever coming back up.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "policy-system"]
