apiVersion: gym.jerry.io/v1
kind: Exercise

metadata:
  name: cks-023-api-server-audit-logging
  title: "CKS-023 - API Server Audit Logging"
  track: cks
  week: 12
  order: 23

spec:
  difficulty: intermediate
  estimatedTime: 35m
  points: 140
  implementationStatus: scaffold

  description: |
    Create `/etc/kubernetes/audit-policy.yaml` with ordered rules for health endpoints, secrets, pods/exec, changes to key resources, and a Metadata catch-all. Configure API server audit flags, restart, generate events, and verify levels.

  learningOutcomes:
    - "Practice CKS domain: Monitoring, Logging & Runtime Security"
    - "Apply concepts: audit policy, audit log backend, audit levels"
    - "Validate the fix with kubectl and security-focused checks"

  tags:
    - "cks"
    - "cks-monitoring-logging-runtime-security"
    - "tier-2"
    - "vagrant"
    - "audit-policy"
    - "audit-log-backend"
    - "audit-levels"


  environment:
    type: kubernetes
    kubernetes:
      provider: vagrant
      createCluster: true
      namespace: default
      vagrant:
        bootstrapMode: managed
        box: bento/ubuntu-22.04
        kubernetesVersion: v1.35
        topology:
          controlPlanes: 1
          workers: 2
        network:
          privateCidr: 192.168.56.0/24
        resources:
          controlPlane:
            cpus: 2
            memoryMb: 4096
          worker:
            cpus: 2
            memoryMb: 3072

  checks:
    - name: "Executable lab checks implemented"
      type: script
      script: |
        echo "CKS-023 is scaffolded from the CKS track specification." >&2
        echo "Implement setup manifests/scripts and executable checks before enabling completion." >&2
        echo "Planned check criteria:" >&2
        cat >&2 <<'CRITERIA'
        - Audit policy file exists with correct order
        - None for healthz/readyz
        - Metadata for secrets, RequestResponse for pods/exec, Request for changes
        - Catch-all Metadata
        - API server has audit flags and is healthy
        - Audit log contains events at correct levels
        CRITERIA
        exit 1
      expectExitCode: 0

  hints:
    - cost: 0
      file: hints/hint-1.md
    - cost: 25
      file: hints/hint-2.md
    - cost: 50
      file: hints/hint-3.md

  successMessage: |
    CKS-023 complete. You remediated the target CKS scenario and verified the controls.

  jerryDialog:
    onStart: "Jerry left a CKS-shaped security incident here. The exam prompt is clean; the mess is not."
    onCheckFail: "The scaffold is loaded, but the executable lab still needs real setup and checks."
    onComplete: "Security control verified. Jerry has fewer sharp objects now."
