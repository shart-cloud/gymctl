apiVersion: gym.jerry.io/v1
kind: Exercise

metadata:
  name: cks-002-cis-benchmark-remediation-kube-bench
  title: "CKS-002 - CIS Benchmark Remediation with kube-bench"
  track: cks
  week: 12
  order: 2

spec:
  difficulty: intermediate
  estimatedTime: 35m
  points: 140
  implementationStatus: scaffold

  description: |
    A kube-bench run is saved on the control plane at `/root/kube-bench-results.json`. Remediate targeted API server and kubelet failures: anonymous auth, profiling, audit log path, kubelet anonymous auth, authorization mode, and protectKernelDefaults.

  learningOutcomes:
    - "Practice CKS domain: Cluster Setup"
    - "Apply concepts: CIS Kubernetes Benchmark, kube-bench, API server flags, kubelet config"
    - "Validate the fix with kubectl and security-focused checks"

  tags:
    - "cks"
    - "cks-cluster-setup"
    - "tier-2"
    - "vagrant"
    - "cis-kubernetes-benchmark"
    - "kube-bench"
    - "api-server-flags"
    - "kubelet-config"


  environment:
    type: kubernetes
    kubernetes:
      provider: vagrant
      createCluster: true
      namespace: default
      vagrant:
        bootstrapMode: managed
        box: bento/ubuntu-22.04
        kubernetesVersion: v1.35
        topology:
          controlPlanes: 1
          workers: 2
        network:
          privateCidr: 192.168.56.0/24
        resources:
          controlPlane:
            cpus: 2
            memoryMb: 4096
          worker:
            cpus: 2
            memoryMb: 3072

  checks:
    - name: "Executable lab checks implemented"
      type: script
      script: |
        echo "CKS-002 is scaffolded from the CKS track specification." >&2
        echo "Implement setup manifests/scripts and executable checks before enabling completion." >&2
        echo "Planned check criteria:" >&2
        cat >&2 <<'CRITERIA'
        - API server manifest has anonymous-auth=false, profiling=false, audit-log-path configured
        - Kubelet config disables anonymous auth, uses Webhook authorization, and protectKernelDefaults=true
        - API server and kubelet restart healthy
        - kube-bench targeted checks pass
        CRITERIA
        exit 1
      expectExitCode: 0

  hints:
    - cost: 0
      file: hints/hint-1.md
    - cost: 25
      file: hints/hint-2.md
    - cost: 50
      file: hints/hint-3.md

  successMessage: |
    CKS-002 complete. You remediated the target CKS scenario and verified the controls.

  tasking:
    ticket: "CKS-002"
    priority: "P2"
    summary: "CIS Benchmark Remediation with kube-bench"
    description: "Scaffolded CKS exercise for Cluster Setup using vm infrastructure."
    reporter: "GRIM-9"

  jerryDialog:
    onStart: "Jerry left a CKS-shaped security incident here. The exam prompt is clean; the mess is not."
    onCheckFail: "The scaffold is loaded, but the executable lab still needs real setup and checks."
    onComplete: "Security control verified. Jerry has fewer sharp objects now."
