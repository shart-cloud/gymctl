# The broken starting state. Both workloads pin their pod-level seccompProfile
# to `Unconfined` — the kernel applies NO syscall filter, so every syscall the
# container makes (including dangerous ones like unshare(CLONE_NEWUSER)) is
# allowed. Your job is to move each Deployment onto a real seccomp profile
# without breaking it. The Deployments keep the same name/namespace, so the
# solution is a plain `kubectl apply` that flips only the seccompProfile.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: public
  labels:
    app: web-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      securityContext:
        # DANGEROUS: no syscall confinement at all.
        seccompProfile:
          type: Unconfined
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-writer
  namespace: monitoring
  labels:
    app: log-writer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-writer
  template:
    metadata:
      labels:
        app: log-writer
    spec:
      securityContext:
        # DANGEROUS: no syscall confinement at all.
        seccompProfile:
          type: Unconfined
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
