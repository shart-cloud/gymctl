# web-frontend hardened onto the RuntimeDefault seccomp profile.
#
# RuntimeDefault means "use the container runtime's built-in default profile"
# (for containerd/runc this is the well-known moby default). It allows the
# common syscalls an application needs and BLOCKS a curated set of dangerous
# ones — including unshare(CLONE_NEWUSER), which a default container has no
# business calling. No file on the node is required: the profile ships with the
# runtime. This is the profile every workload should carry unless it has a
# specific reason not to.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: public
  labels:
    app: web-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
