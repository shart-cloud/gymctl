apiVersion: gym.jerry.io/v1
kind: Exercise

metadata:
  name: cks-010-seccomp-profiles
  title: "CKS-010 - Seccomp Profiles"
  track: cks
  week: 12
  order: 10

spec:
  difficulty: intermediate
  estimatedTime: 35m
  points: 140
  implementationStatus: scaffold

  description: |
    Move `public/web-frontend` to RuntimeDefault seccomp and `monitoring/log-writer` to the Localhost profile at `profiles/audit-write-only.json`. Verify pods run and blocked syscalls fail.

  learningOutcomes:
    - "Practice CKS domain: System Hardening"
    - "Apply concepts: seccomp, RuntimeDefault, Localhost profiles, securityContext"
    - "Validate the fix with kubectl and security-focused checks"

  tags:
    - "cks"
    - "cks-system-hardening"
    - "tier-2"
    - "vagrant"
    - "seccomp"
    - "runtimedefault"
    - "localhost-profiles"
    - "securitycontext"


  environment:
    type: kubernetes
    kubernetes:
      provider: vagrant
      createCluster: true
      namespace: default
      vagrant:
        bootstrapMode: managed
        box: bento/ubuntu-22.04
        kubernetesVersion: v1.35
        topology:
          controlPlanes: 1
          workers: 2
        network:
          privateCidr: 192.168.56.0/24
        resources:
          controlPlane:
            cpus: 2
            memoryMb: 4096
          worker:
            cpus: 2
            memoryMb: 3072

  checks:
    - name: "Executable lab checks implemented"
      type: script
      script: |
        echo "CKS-010 is scaffolded from the CKS track specification." >&2
        echo "Implement setup manifests/scripts and executable checks before enabling completion." >&2
        echo "Planned check criteria:" >&2
        cat >&2 <<'CRITERIA'
        - web-frontend uses RuntimeDefault seccomp
        - log-writer uses Localhost profile with correct path
        - Both deployments have running pods
        - unshare is blocked in web-frontend
        CRITERIA
        exit 1
      expectExitCode: 0

  hints:
    - cost: 0
      file: hints/hint-1.md
    - cost: 25
      file: hints/hint-2.md
    - cost: 50
      file: hints/hint-3.md

  successMessage: |
    CKS-010 complete. You remediated the target CKS scenario and verified the controls.

  tasking:
    ticket: "CKS-010"
    priority: "P2"
    summary: "Seccomp Profiles"
    description: "Scaffolded CKS exercise for System Hardening using vm infrastructure."
    reporter: "GRIM-9"

  jerryDialog:
    onStart: "Jerry left a CKS-shaped security incident here. The exam prompt is clean; the mess is not."
    onCheckFail: "The scaffold is loaded, but the executable lab still needs real setup and checks."
    onComplete: "Security control verified. Jerry has fewer sharp objects now."
