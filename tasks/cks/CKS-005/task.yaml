apiVersion: gym.jerry.io/v1
kind: Exercise

metadata:
  name: cks-005-rbac-least-privilege
  title: "CKS-005 - RBAC Least Privilege"
  track: cks
  week: 12
  order: 5

spec:
  difficulty: beginner
  estimatedTime: 25m
  points: 100
  implementationStatus: scaffold

  description: |
    In `dev-team`, replace `ci-bot` cluster-admin access with namespace-scoped permissions for deployments, services, and configmaps, plus read-only cluster access to namespaces and nodes. Verify with `kubectl auth can-i`.

  learningOutcomes:
    - "Practice CKS domain: Cluster Hardening"
    - "Apply concepts: RBAC Roles, RoleBindings, ClusterRoles, least privilege"
    - "Validate the fix with kubectl and security-focused checks"

  tags:
    - "cks"
    - "cks-cluster-hardening"
    - "tier-1"
    - "kind"
    - "rbac-roles"
    - "rolebindings"
    - "clusterroles"
    - "least-privilege"


  environment:
    type: kubernetes
    kubernetes:
      provider: kind
      createCluster: true
      namespace: default

  checks:
    - name: "Executable lab checks implemented"
      type: script
      script: |
        echo "CKS-005 is scaffolded from the CKS track specification." >&2
        echo "Implement setup manifests/scripts and executable checks before enabling completion." >&2
        echo "Planned check criteria:" >&2
        cat >&2 <<'CRITERIA'
        - No cluster-admin binding remains for ci-bot
        - Role ci-bot-dev has correct namespace rules
        - RoleBinding binds ci-bot-dev to ci-bot
        - ClusterRole ci-bot-readonly has get/list on namespaces and nodes only
        - ClusterRoleBinding binds ci-bot-readonly to ci-bot
        - can-i create deployments yes; delete pods and get secrets no
        CRITERIA
        exit 1
      expectExitCode: 0

  hints:
    - cost: 0
      file: hints/hint-1.md
    - cost: 25
      file: hints/hint-2.md
    - cost: 50
      file: hints/hint-3.md

  successMessage: |
    CKS-005 complete. You remediated the target CKS scenario and verified the controls.

  tasking:
    ticket: "CKS-005"
    priority: "P1"
    summary: "RBAC Least Privilege"
    description: "Scaffolded CKS exercise for Cluster Hardening using kind infrastructure."
    reporter: "GRIM-9"

  jerryDialog:
    onStart: "Jerry left a CKS-shaped security incident here. The exam prompt is clean; the mess is not."
    onCheckFail: "The scaffold is loaded, but the executable lab still needs real setup and checks."
    onComplete: "Security control verified. Jerry has fewer sharp objects now."
