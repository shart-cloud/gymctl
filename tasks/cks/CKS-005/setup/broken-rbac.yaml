# Broken state: ci-bot is cluster-admin. Too much power for a CI robot.
apiVersion: v1
kind: Namespace
metadata:
  name: dev-team
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-bot
  namespace: dev-team
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ci-bot-cluster-admin
subjects:
  - kind: ServiceAccount
    name: ci-bot
    namespace: dev-team
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
