# default SA: no automount for anything that falls back to it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: production
automountServiceAccountToken: false
---
# Dedicated least-privilege SA for the one workload that calls the API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-sa
  namespace: production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-sa
  namespace: production
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-sa
  namespace: production
subjects:
  - kind: ServiceAccount
    name: api-sa
    namespace: production
roleRef:
  kind: Role
  name: api-sa
  apiGroup: rbac.authorization.k8s.io
---
# web-app: no token.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: production
  labels: { app: web-app }
spec:
  replicas: 1
  selector: { matchLabels: { app: web-app } }
  template:
    metadata:
      labels: { app: web-app }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 36000"]
---
# worker: no token.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: production
  labels: { app: worker }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker } }
  template:
    metadata:
      labels: { app: worker }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "sleep 36000"]
---
# api-server: runs as api-sa and keeps its token.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: production
  labels: { app: api-server }
spec:
  replicas: 1
  selector: { matchLabels: { app: api-server } }
  template:
    metadata:
      labels: { app: api-server }
    spec:
      serviceAccountName: api-sa
      automountServiceAccountToken: true
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c", "sleep 36000"]
