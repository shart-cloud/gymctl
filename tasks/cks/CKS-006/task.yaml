apiVersion: gym.jerry.io/v1
kind: Exercise

metadata:
  name: cks-006-service-account-hardening
  title: "CKS-006 - Service Account Hardening"
  track: cks
  week: 12
  order: 6

spec:
  difficulty: beginner
  estimatedTime: 25m
  points: 100
  implementationStatus: scaffold

  description: |
    Harden ServiceAccount token exposure in `production`: disable automount on the default SA, disable tokens for `web-app` and `worker`, create `api-sa` with minimal Secret/ConfigMap read access, and assign it to `api-server`.

  learningOutcomes:
    - "Practice CKS domain: Cluster Hardening"
    - "Apply concepts: automountServiceAccountToken, default service account, bound service account tokens"
    - "Validate the fix with kubectl and security-focused checks"

  tags:
    - "cks"
    - "cks-cluster-hardening"
    - "tier-1"
    - "kind"
    - "automountserviceaccounttoken"
    - "default-service-account"
    - "bound-service-account-tokens"


  environment:
    type: kubernetes
    kubernetes:
      provider: kind
      createCluster: true
      namespace: default

  checks:
    - name: "Executable lab checks implemented"
      type: script
      script: |
        echo "CKS-006 is scaffolded from the CKS track specification." >&2
        echo "Implement setup manifests/scripts and executable checks before enabling completion." >&2
        echo "Planned check criteria:" >&2
        cat >&2 <<'CRITERIA'
        - default SA automountServiceAccountToken=false
        - web-app and worker disable token automount
        - api-sa exists with minimal Role/RoleBinding
        - api-server uses api-sa
        - Token file absent in web-app/worker and present in api-server
        CRITERIA
        exit 1
      expectExitCode: 0

  hints:
    - cost: 0
      file: hints/hint-1.md
    - cost: 25
      file: hints/hint-2.md
    - cost: 50
      file: hints/hint-3.md

  successMessage: |
    CKS-006 complete. You remediated the target CKS scenario and verified the controls.

  tasking:
    ticket: "CKS-006"
    priority: "P1"
    summary: "Service Account Hardening"
    description: "Scaffolded CKS exercise for Cluster Hardening using kind infrastructure."
    reporter: "GRIM-9"

  jerryDialog:
    onStart: "Jerry left a CKS-shaped security incident here. The exam prompt is clean; the mess is not."
    onCheckFail: "The scaffold is loaded, but the executable lab still needs real setup and checks."
    onComplete: "Security control verified. Jerry has fewer sharp objects now."
