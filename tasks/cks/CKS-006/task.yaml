apiVersion: gym.jerry.io/v1
kind: Exercise

metadata:
  name: cks-006-service-account-hardening
  title: "CKS-006 - Service Account Hardening"
  track: cks
  week: 12
  order: 6

spec:
  difficulty: intermediate
  estimatedTime: 25m
  points: 100
  implementationStatus: ready

  description: |
    Every workload in `production` mounts a ServiceAccount token it never uses.
    If any of these pods is compromised, the attacker gets a Kubernetes API
    credential for free. Only `api-server` actually calls the API.

    Harden token exposure:

      1. Set `automountServiceAccountToken: false` on the `default`
         ServiceAccount in `production`.
      2. Stop `web-app` and `worker` from mounting a token
         (`automountServiceAccountToken: false` on their pod specs).
      3. Create ServiceAccount `api-sa` with a Role granting only `get`/`list`
         on `secrets` and `configmaps`, bound with a RoleBinding.
      4. Make the `api-server` deployment use `api-sa` (and keep its token).

    Afterward: `web-app` and `worker` pods must have **no** token file, and
    `api-server` pods must **have** one and run as `api-sa`.

  learningOutcomes:
    - "CKS domain: System Hardening — minimize ServiceAccount exposure"
    - "Disable token automount at the ServiceAccount and pod level"
    - "Grant a workload its own least-privilege ServiceAccount"
    - "Confirm token presence/absence from inside the pod"

  tags:
    - "cks"
    - "cks-system-hardening"
    - "tier-1"
    - "kind"
    - "serviceaccount"
    - "token-automount"

  environment:
    type: kubernetes
    kubernetes:
      provider: kind
      createCluster: true
      namespace: production
    customSetup:
      - type: script
        timeout: 150s
        script: |
          set -euo pipefail
          kubectl apply -f setup/workloads.yaml
          kubectl -n production rollout status deploy/web-app    --timeout=120s
          kubectl -n production rollout status deploy/worker     --timeout=120s
          kubectl -n production rollout status deploy/api-server --timeout=120s

  checks:
    - name: "default ServiceAccount disables token automount"
      type: jsonpath
      namespace: production
      resource: serviceaccount/default
      jsonpath: "{.automountServiceAccountToken}"
      operator: equals
      value: false

    - name: "api-sa ServiceAccount exists"
      type: resourceExists
      namespace: production
      resource: serviceaccount/api-sa

    - name: "api-sa Role exists"
      type: resourceExists
      namespace: production
      resource: role/api-sa

    - name: "api-server deployment uses api-sa"
      type: jsonpath
      namespace: production
      resource: deployment/api-server
      jsonpath: "{.spec.template.spec.serviceAccountName}"
      operator: equals
      value: api-sa

    - name: "web-app pod has NO ServiceAccount token mounted"
      type: script
      script: |
        set -euo pipefail
        kubectl -n production exec deploy/web-app -- \
          sh -c '! test -e /var/run/secrets/kubernetes.io/serviceaccount/token'
        echo "web-app has no token (good)"

    - name: "worker pod has NO ServiceAccount token mounted"
      type: script
      script: |
        set -euo pipefail
        kubectl -n production exec deploy/worker -- \
          sh -c '! test -e /var/run/secrets/kubernetes.io/serviceaccount/token'
        echo "worker has no token (good)"

    - name: "api-server pod HAS a ServiceAccount token mounted"
      type: script
      script: |
        set -euo pipefail
        kubectl -n production exec deploy/api-server -- \
          sh -c 'test -s /var/run/secrets/kubernetes.io/serviceaccount/token'
        echo "api-server has its token (good)"

  hints:
    - cost: 0
      file: hints/hint-1.md
    - cost: 25
      file: hints/hint-2.md
    - cost: 50
      file: hints/hint-3.md

  successMessage: |
    CKS-006 complete. Only the workload that needs the API keeps a token, and it
    runs as a least-privilege ServiceAccount. web-app and worker no longer ship
    a free API credential to whoever compromises them.

    **Key takeaway:** token automount defaults to on. Disable it on the default
    SA and on pods that don't call the API, and give the ones that do their own
    scoped ServiceAccount.

  references:
    - title: "Configure Service Accounts for Pods"
      url: "https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/"

  jerryDialog:
    onStart: "Every pod in production is carrying an API token it never uses. That's a free credential for any attacker who lands one shell. Take them away."
    onCheckFail: "Some pod still has a token it shouldn't, or the one that needs it lost it. Check each pod's mount."
    onComplete: "Token exposure minimized. Compromising web-app no longer hands over a cluster credential."
