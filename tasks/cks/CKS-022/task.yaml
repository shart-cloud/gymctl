apiVersion: gym.jerry.io/v1
kind: Exercise

metadata:
  name: cks-022-falco-runtime-monitoring
  title: "CKS-022 - Falco Runtime Monitoring"
  track: cks
  week: 12
  order: 22

spec:
  difficulty: intermediate
  estimatedTime: 35m
  points: 140
  implementationStatus: scaffold

  description: |
    Write Falco custom rules for terminal shells in containers, `/etc/shadow` reads, and unusual outbound connections. Restart Falco, trigger each behavior, and verify alerts in Falco output.

  learningOutcomes:
    - "Practice CKS domain: Monitoring, Logging & Runtime Security"
    - "Apply concepts: Falco, custom runtime rules, alert output"
    - "Validate the fix with kubectl and security-focused checks"

  tags:
    - "cks"
    - "cks-monitoring-logging-runtime-security"
    - "tier-2"
    - "vagrant"
    - "falco"
    - "custom-runtime-rules"
    - "alert-output"


  environment:
    type: kubernetes
    kubernetes:
      provider: vagrant
      createCluster: true
      namespace: default
      vagrant:
        bootstrapMode: managed
        box: bento/ubuntu-22.04
        kubernetesVersion: v1.35
        topology:
          controlPlanes: 1
          workers: 2
        network:
          privateCidr: 192.168.56.0/24
        resources:
          controlPlane:
            cpus: 2
            memoryMb: 4096
          worker:
            cpus: 2
            memoryMb: 3072

  checks:
    - name: "Executable lab checks implemented"
      type: script
      script: |
        echo "CKS-022 is scaffolded from the CKS track specification." >&2
        echo "Implement setup manifests/scripts and executable checks before enabling completion." >&2
        echo "Planned check criteria:" >&2
        cat >&2 <<'CRITERIA'
        - Custom rules file exists with three valid rules
        - Falco restarts without errors
        - Shell exec alert fires
        - Shadow file alert fires
        - Unexpected outbound connection alert fires
        CRITERIA
        exit 1
      expectExitCode: 0

  hints:
    - cost: 0
      file: hints/hint-1.md
    - cost: 25
      file: hints/hint-2.md
    - cost: 50
      file: hints/hint-3.md

  successMessage: |
    CKS-022 complete. You remediated the target CKS scenario and verified the controls.

  jerryDialog:
    onStart: "Jerry left a CKS-shaped security incident here. The exam prompt is clean; the mess is not."
    onCheckFail: "The scaffold is loaded, but the executable lab still needs real setup and checks."
    onComplete: "Security control verified. Jerry has fewer sharp objects now."
