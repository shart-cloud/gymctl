apiVersion: gym.jerry.io/v1
kind: Exercise

metadata:
  name: cks-011-node-kubelet-hardening
  title: "CKS-011 - Node and Kubelet Hardening"
  track: cks
  week: 12
  order: 11

spec:
  difficulty: intermediate
  estimatedTime: 35m
  points: 140
  implementationStatus: scaffold

  description: |
    Harden worker-2: disable kubelet readOnlyPort, disable anonymous auth, use Webhook authorization, rotate certificates, disable unnecessary services, fix kubelet and PKI permissions, restart kubelet, and verify Ready.

  learningOutcomes:
    - "Practice CKS domain: System Hardening"
    - "Apply concepts: Kubelet config, OS surface reduction, file permissions"
    - "Validate the fix with kubectl and security-focused checks"

  tags:
    - "cks"
    - "cks-system-hardening"
    - "tier-2"
    - "vagrant"
    - "kubelet-config"
    - "os-surface-reduction"
    - "file-permissions"


  environment:
    type: kubernetes
    kubernetes:
      provider: vagrant
      createCluster: true
      namespace: default
      vagrant:
        bootstrapMode: managed
        box: bento/ubuntu-22.04
        kubernetesVersion: v1.35
        topology:
          controlPlanes: 1
          workers: 2
        network:
          privateCidr: 192.168.56.0/24
        resources:
          controlPlane:
            cpus: 2
            memoryMb: 4096
          worker:
            cpus: 2
            memoryMb: 3072

  checks:
    - name: "Executable lab checks implemented"
      type: script
      script: |
        echo "CKS-011 is scaffolded from the CKS track specification." >&2
        echo "Implement setup manifests/scripts and executable checks before enabling completion." >&2
        echo "Planned check criteria:" >&2
        cat >&2 <<'CRITERIA'
        - Kubelet config has required settings
        - rpcbind and snapd are stopped and disabled
        - Kubelet config is root:root 600
        - PKI cert/key permissions are not too permissive
        - Kubelet restarted and node Ready
        CRITERIA
        exit 1
      expectExitCode: 0

  hints:
    - cost: 0
      file: hints/hint-1.md
    - cost: 25
      file: hints/hint-2.md
    - cost: 50
      file: hints/hint-3.md

  successMessage: |
    CKS-011 complete. You remediated the target CKS scenario and verified the controls.

  jerryDialog:
    onStart: "Jerry left a CKS-shaped security incident here. The exam prompt is clean; the mess is not."
    onCheckFail: "The scaffold is loaded, but the executable lab still needs real setup and checks."
    onComplete: "Security control verified. Jerry has fewer sharp objects now."
