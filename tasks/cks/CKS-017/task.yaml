apiVersion: gym.jerry.io/v1
kind: Exercise

metadata:
  name: cks-017-base-image-minimization
  title: "CKS-017 - Base Image Minimization"
  track: cks
  week: 12
  order: 17

spec:
  difficulty: beginner
  estimatedTime: 25m
  points: 100
  implementationStatus: scaffold

  description: |
    Rewrite `/root/app/Dockerfile` for a Go app from a 1.2GB Ubuntu build image to a multi-stage build using `golang:1.22-alpine` and `gcr.io/distroless/static-debian12`, run as non-root, build `app:secure`, and verify size and behavior.

  learningOutcomes:
    - "Practice CKS domain: Supply Chain Security"
    - "Apply concepts: multi-stage builds, distroless images, image layer reduction"
    - "Validate the fix with kubectl and security-focused checks"

  tags:
    - "cks"
    - "cks-supply-chain-security"
    - "tier-1"
    - "kind"
    - "multi-stage-builds"
    - "distroless-images"
    - "image-layer-reduction"


  environment:
    type: kubernetes
    kubernetes:
      provider: kind
      createCluster: true
      namespace: default

  checks:
    - name: "Executable lab checks implemented"
      type: script
      script: |
        echo "CKS-017 is scaffolded from the CKS track specification." >&2
        echo "Implement setup manifests/scripts and executable checks before enabling completion." >&2
        echo "Planned check criteria:" >&2
        cat >&2 <<'CRITERIA'
        - Dockerfile uses multi-stage build
        - Final stage uses distroless
        - Final image runs as non-root
        - Image size below 20MB
        - Container runs and app responds
        CRITERIA
        exit 1
      expectExitCode: 0

  hints:
    - cost: 0
      file: hints/hint-1.md
    - cost: 25
      file: hints/hint-2.md
    - cost: 50
      file: hints/hint-3.md

  successMessage: |
    CKS-017 complete. You remediated the target CKS scenario and verified the controls.

  tasking:
    ticket: "CKS-017"
    priority: "P1"
    summary: "Base Image Minimization"
    description: "Scaffolded CKS exercise for Supply Chain Security using kind infrastructure."
    reporter: "GRIM-9"

  jerryDialog:
    onStart: "Jerry left a CKS-shaped security incident here. The exam prompt is clean; the mess is not."
    onCheckFail: "The scaffold is loaded, but the executable lab still needs real setup and checks."
    onComplete: "Security control verified. Jerry has fewer sharp objects now."
