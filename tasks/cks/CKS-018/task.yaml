apiVersion: gym.jerry.io/v1
kind: Exercise

metadata:
  name: cks-018-container-image-vulnerability-scanning
  title: "CKS-018 - Container Image Vulnerability Scanning"
  track: cks
  week: 12
  order: 18

spec:
  difficulty: beginner
  estimatedTime: 25m
  points: 100
  implementationStatus: scaffold

  description: |
    Use Trivy to scan nginx, redis, and a custom app image for HIGH/CRITICAL vulnerabilities, write reports, update Deployments using CRITICAL-vulnerable images to patched minor versions, and re-scan.

  learningOutcomes:
    - "Practice CKS domain: Supply Chain Security"
    - "Apply concepts: Trivy, vulnerability severity, remediation decisions"
    - "Validate the fix with kubectl and security-focused checks"

  tags:
    - "cks"
    - "cks-supply-chain-security"
    - "tier-1"
    - "kind"
    - "trivy"
    - "vulnerability-severity"
    - "remediation-decisions"


  environment:
    type: kubernetes
    kubernetes:
      provider: kind
      createCluster: true
      namespace: default

  checks:
    - name: "Executable lab checks implemented"
      type: script
      script: |
        echo "CKS-018 is scaffolded from the CKS track specification." >&2
        echo "Implement setup manifests/scripts and executable checks before enabling completion." >&2
        echo "Planned check criteria:" >&2
        cat >&2 <<'CRITERIA'
        - Scan result files exist
        - Deployments using vulnerable images are updated
        - Re-scan shows no CRITICAL vulnerabilities
        CRITERIA
        exit 1
      expectExitCode: 0

  hints:
    - cost: 0
      file: hints/hint-1.md
    - cost: 25
      file: hints/hint-2.md
    - cost: 50
      file: hints/hint-3.md

  successMessage: |
    CKS-018 complete. You remediated the target CKS scenario and verified the controls.

  tasking:
    ticket: "CKS-018"
    priority: "P1"
    summary: "Container Image Vulnerability Scanning"
    description: "Scaffolded CKS exercise for Supply Chain Security using kind infrastructure."
    reporter: "GRIM-9"

  jerryDialog:
    onStart: "Jerry left a CKS-shaped security incident here. The exam prompt is clean; the mess is not."
    onCheckFail: "The scaffold is loaded, but the executable lab still needs real setup and checks."
    onComplete: "Security control verified. Jerry has fewer sharp objects now."
