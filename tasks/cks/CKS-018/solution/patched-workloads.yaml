# The same three Deployments, bumped to patched, pinned tags. Applying this file
# rolls each workload from its vulnerable tag to one where the CRITICALs are
# fixed, without changing anything else about the workload.
#
#   web-frontend  nginx:1.20.0-alpine  -> nginx:1.27.4-alpine
#   session-cache redis:6.2.6-alpine   -> redis:7.4.2-alpine
#   payments-app  python:3.9-alpine    -> python:3.12-alpine
#
# Still pinned (never `:latest`) so the result is reproducible and re-scannable.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: supply-chain
  labels:
    app: web-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.4-alpine
          ports:
            - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-cache
  namespace: supply-chain
  labels:
    app: session-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: session-cache
  template:
    metadata:
      labels:
        app: session-cache
    spec:
      containers:
        - name: redis
          image: redis:7.4.2-alpine
          ports:
            - containerPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-app
  namespace: supply-chain
  labels:
    app: payments-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-app
  template:
    metadata:
      labels:
        app: payments-app
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "-m", "http.server", "8080"]
          ports:
            - containerPort: 8080
