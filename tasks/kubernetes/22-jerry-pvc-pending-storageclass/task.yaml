apiVersion: gym.jerry.io/v1
kind: Exercise

metadata:
  name: jerry-pvc-pending-storageclass
  title: "Jerry's PVC Stuck Pending"
  track: k8s-storage
  week: 5
  order: 2

spec:
  difficulty: intermediate
  estimatedTime: 25m
  points: 130

  description: |
    Jerry created a PersistentVolumeClaim for stateful data, but it never binds.
    The claim references a StorageClass that does not exist, so the app pod is
    stuck Pending waiting for storage.

    Fix storage provisioning so the PVC binds and the workload starts.

  learningOutcomes:
    - "Diagnose PVC Pending state from events and describe output"
    - "Align PVC storageClassName with an available StorageClass"
    - "Validate pod recovery after storage binding"

  tags:
    - storage
    - pvc
    - storageclass
    - troubleshooting

  environment:
    type: kubernetes
    kubernetes:
      createCluster: true
      namespace: default
      setupManifests:
        - setup/storageclass.yaml
        - setup/pvc.yaml
        - setup/pod.yaml

  checks:
    - name: "PVC is Bound"
      type: script
      script: |
        set -e
        for i in $(seq 1 60); do
          phase=$(kubectl get pvc jerry-data -o jsonpath='{.status.phase}' 2>/dev/null || true)
          if [ "$phase" = "Bound" ]; then
            exit 0
          fi
          sleep 2
        done
        echo "FAIL: pvc phase=$(kubectl get pvc jerry-data -o jsonpath='{.status.phase}' 2>/dev/null || true)"
        exit 1
      expectExitCode: 0

    - name: "Pod starts after PVC binding"
      type: script
      script: |
        set -e
        for i in $(seq 1 60); do
          phase=$(kubectl get pod jerry-storage-app -o jsonpath='{.status.phase}' 2>/dev/null || true)
          if [ "$phase" = "Running" ]; then
            exit 0
          fi
          sleep 2
        done
        echo "FAIL: pod phase=$(kubectl get pod jerry-storage-app -o jsonpath='{.status.phase}' 2>/dev/null || true)"
        exit 1
      expectExitCode: 0

    - name: "Mounted volume is writable"
      type: script
      script: |
        set -e
        kubectl exec jerry-storage-app -- sh -c 'echo storage-ok > /data/probe && grep -q storage-ok /data/probe'
      expectExitCode: 0

  hints:
    - cost: 0
      file: hints/hint-1.md
    - cost: 25
      file: hints/hint-2.md
    - cost: 50
      file: hints/hint-3.md

  successMessage: |
    Nice recovery. Jerry's claim now binds and the app can write to persistent storage.

    **Key takeaway:** when PVCs are Pending, start with StorageClass alignment,
    then confirm PVC phase and workload recovery.
