apiVersion: v1
kind: Pod
metadata:
  name: jerry-storage-app
  labels:
    app: jerry-storage-app
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo starting && sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: jerry-data
