apiVersion: batch/v1
kind: CronJob
metadata:
  name: jerry-reports
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: report
            image: busybox:1.36
            command:
            - sh
            - -c
            - |
              echo "generating report..."
              sleep 180
              echo "done"
