apiVersion: gym.jerry.io/v1
kind: Exercise

metadata:
  name: jerry-nodeport-mystery
  title: "Jerry's NodePort Mystery"
  track: k8s-networking
  week: 6
  order: 1

spec:
  difficulty: intermediate
  estimatedTime: 20m
  points: 110

  description: |
    Jerry exposed his app as a NodePort Service, but traffic still fails.
    The Service exists, pods are running, and the NodePort is allocated,
    but requests never reach the app.

    Fix the Service port mapping so traffic reaches the container.

  learningOutcomes:
    - "Troubleshoot NodePort service wiring"
    - "Validate Service port vs targetPort"
    - "Use temporary debug pods to confirm connectivity"

  tags:
    - networking
    - services
    - nodeport
    - troubleshooting

  environment:
    type: kubernetes
    kubernetes:
      createCluster: true
      namespace: default
      setupManifests:
        - setup/deployment.yaml
        - setup/service.yaml
      waitFor:
        - resource: deployment/jerry-nodeport-app
          condition: available
          timeout: 120s

  checks:
    - name: "Service type is NodePort"
      type: jsonpath
      resource: service/jerry-nodeport
      jsonpath: "{.spec.type}"
      operator: equals
      value: "NodePort"

    - name: "NodePort is allocated"
      type: jsonpath
      resource: service/jerry-nodeport
      jsonpath: "{.spec.ports[0].nodePort}"
      operator: exists

    - name: "Service targetPort points to app port"
      type: jsonpath
      resource: service/jerry-nodeport
      jsonpath: "{.spec.ports[0].targetPort}"
      operator: equals
      value: 5678

    - name: "Service is reachable from inside cluster"
      type: script
      script: |
        set -e
        kubectl delete pod svc-probe --ignore-not-found >/dev/null 2>&1 || true
        kubectl run svc-probe --image=busybox:1.36 --restart=Never --command -- sh -c "wget -qO- -T 5 http://jerry-nodeport | grep -q 'jerry-nodeport-ok'"

        for i in $(seq 1 30); do
          phase=$(kubectl get pod svc-probe -o jsonpath='{.status.phase}' 2>/dev/null || true)
          if [ "$phase" = "Succeeded" ] || [ "$phase" = "Failed" ]; then
            break
          fi
          sleep 1
        done

        phase=$(kubectl get pod svc-probe -o jsonpath='{.status.phase}' 2>/dev/null || true)
        logs=$(kubectl logs svc-probe 2>/dev/null || true)
        kubectl delete pod svc-probe --ignore-not-found >/dev/null 2>&1 || true

        if [ "$phase" = "Succeeded" ]; then
          echo "OK: Service returned expected response"
          exit 0
        fi

        echo "FAIL: Service check pod phase=$phase"
        echo "$logs"
        exit 1
      expectExitCode: 0

  hints:
    - cost: 0
      file: hints/hint-1.md
    - cost: 25
      file: hints/hint-2.md
    - cost: 50
      file: hints/hint-3.md

  successMessage: |
    Nice fix. Jerry's NodePort is now correctly mapped end-to-end.

    **Key takeaway:** `port` is the Service port clients hit, and `targetPort`
    must match the port your container actually listens on.
