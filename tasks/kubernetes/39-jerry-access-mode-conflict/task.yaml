apiVersion: gym.jerry.io/v1
kind: Exercise

metadata:
  name: jerry-access-mode-conflict
  title: "Jerry's PVC Stuck on Access Mode"
  track: k8s-storage
  week: 5
  order: 5

spec:
  difficulty: intermediate
  estimatedTime: 20m
  points: 120

  description: |
    Jerry created a PVC requesting ReadWriteMany access — but the StorageClass
    only provisions volumes with ReadWriteOnce. The claim stays Pending with a
    cryptic event message and the app pod never starts.

    Fix the access mode so the PVC binds and the pod reaches Running.

  learningOutcomes:
    - "Diagnose access mode incompatibility from PVC events"
    - "Understand ReadWriteOnce vs ReadWriteMany and which backends support each"
    - "Correct PVC access mode to match StorageClass capabilities"

  tags:
    - storage
    - pvc
    - access-modes
    - troubleshooting

  environment:
    type: kubernetes
    kubernetes:
      createCluster: true
      namespace: default
      setupManifests:
        - setup/storageclass.yaml
        - setup/pvc.yaml
        - setup/pod.yaml

  checks:
    - name: "PVC is Bound"
      type: script
      script: |
        set -e
        for i in $(seq 1 60); do
          phase=$(kubectl get pvc jerry-rwx-claim -o jsonpath='{.status.phase}' 2>/dev/null || true)
          if [ "$phase" = "Bound" ]; then exit 0; fi
          sleep 2
        done
        echo "FAIL: pvc phase=$(kubectl get pvc jerry-rwx-claim -o jsonpath='{.status.phase}' 2>/dev/null || true)"
        exit 1
      expectExitCode: 0

    - name: "PVC is bound with ReadWriteOnce"
      type: script
      script: |
        set -e
        mode=$(kubectl get pvc jerry-rwx-claim -o jsonpath='{.status.accessModes[0]}' 2>/dev/null || true)
        if [ "$mode" = "ReadWriteOnce" ]; then exit 0; fi
        echo "FAIL: accessMode is '$mode', expected 'ReadWriteOnce'"
        exit 1
      expectExitCode: 0

    - name: "Pod reaches Running"
      type: script
      script: |
        set -e
        for i in $(seq 1 60); do
          phase=$(kubectl get pod jerry-rwx-app -o jsonpath='{.status.phase}' 2>/dev/null || true)
          if [ "$phase" = "Running" ]; then exit 0; fi
          sleep 2
        done
        echo "FAIL: pod phase=$(kubectl get pod jerry-rwx-app -o jsonpath='{.status.phase}' 2>/dev/null || true)"
        exit 1
      expectExitCode: 0

  hints:
    - cost: 0
      file: hints/hint-1.md
    - cost: 25
      file: hints/hint-2.md
    - cost: 50
      file: hints/hint-3.md

  successMessage: |
    Access mode corrected and PVC bound.

    **Key takeaway:** ReadWriteMany requires a shared storage backend (NFS, CephFS,
    cloud-provided RWX volumes). Local-path provisioners only support ReadWriteOnce.
    The access mode in the PVC must match what the StorageClass can actually provide.
