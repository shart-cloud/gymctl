apiVersion: v1
kind: Pod
metadata:
  name: jerry-config-app
  labels:
    app: jerry-config-app
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
    volumeMounts:
    - name: config
      mountPath: /etc/app/db-host
      subPath: db-host
  volumes:
  - name: config
    configMap:
      name: jerry-app-config
