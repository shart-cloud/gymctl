apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jerry-portfolio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shart-cloud/devsecops-portfolio-template.git
    targetRevision: main
    path: k8s/overlay/local
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
