apiVersion: gym.jerry.io/v1
kind: Exercise

metadata:
  name: jerry-hpa-not-scaling
  title: "Jerry's HPA Shows Unknown Metrics"
  track: k8s-troubleshooting
  week: 7
  order: 28

spec:
  difficulty: intermediate
  estimatedTime: 20m
  points: 125

  description: |
    Jerry configured an HPA for his deployment but it's stuck showing `<unknown>/50%` for CPU utilization.
    The pods aren't scaling despite high load. The HPA exists but can't read metrics.

    Debug and fix the HPA so it can autoscale the deployment.

  learningOutcomes:
    - "Understand HPA dependency on metrics-server"
    - "Diagnose HPA conditions and status"
    - "Configure metrics-server for kind clusters"

  tags:
    - troubleshooting
    - hpa
    - autoscaling
    - metrics-server
    - workloads

  environment:
    type: kubernetes
    kubernetes:
      createCluster: true
      namespace: default
      setupManifests:
        - setup/jerry-deployment.yaml
        - setup/jerry-hpa.yaml
        - setup/load-generator.yaml
      waitFor:
        - resource: deployment/jerry-app
          condition: available
          timeout: 120s
        - resource: pod
          selector: app=load-generator
          condition: ready
          timeout: 120s

  checks:
    - name: "metrics-server is running"
      type: script
      script: check/metrics-server-running.sh

    - name: "kubectl top nodes returns data"
      type: script
      script: check/kubectl-top-works.sh

    - name: "HPA shows numeric CPU utilization"
      type: script
      script: check/hpa-has-metrics.sh

    - name: "HPA has scaled above minReplicas"
      type: script
      script: check/hpa-scaled-up.sh

    - name: "Deployment is Available"
      type: condition
      resource: deployment/jerry-app
      condition: Available
      status: "True"

  hints:
    - cost: 0
      file: hints/hint-1.md
    - cost: 25
      file: hints/hint-2.md
    - cost: 50
      file: hints/hint-3.md

  successMessage: |
    Excellent! Jerry's HPA is now working and autoscaling the deployment.

    **Key takeaway:** HPA requires metrics-server to read CPU/memory utilization.
    In kind clusters, metrics-server needs `--kubelet-insecure-tls` to work with self-signed certs.

  tasking:
    ticket: "OPS-2847"
    priority: "P1"
    summary: "HPA not scaling, shows unknown metrics"
    description: |
      Jerry deployed an HPA but it's not working. The target shows `<unknown>/50%`
      and pods aren't scaling despite high CPU load from our load test.

      This is blocking our autoscaling rollout to production.
    reporter: "SITE-REL-7"

  jerryDialog:
    onStart: "the hpa yaml looks right to me, i copied it from the docs"
    onCheckFail: "it should just work, horizontal pod autoscaler, it's right there in the name"
    onHintUsed: "oh i need something else running? that wasn't in the tutorial"
    onComplete: "so every cluster needs metrics-server? why isn't it built in?"