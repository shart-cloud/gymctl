# The projected volume uses configMapRef: and secretRef: — correct for envFrom,
# but wrong for projected volume sources. Correct syntax is configMap: and secret:.
apiVersion: v1
kind: Pod
metadata:
  name: jerry-projected-app
  labels:
    app: jerry-projected-app
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
    volumeMounts:
    - name: combined-config
      mountPath: /config
  volumes:
  - name: combined-config
    projected:
      sources:
      - configMapRef:
          name: jerry-app-config
      - secretRef:
          name: jerry-app-secret
