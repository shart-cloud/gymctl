apiVersion: apps/v1
kind: Deployment
metadata:
  name: jerry-picky-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jerry-picky-app
  template:
    metadata:
      labels:
        app: jerry-picky-app
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: hardware-type
                operator: In
                values:
                - gpu-enabled
      containers:
      - name: nginx
        image: nginx:1.20
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi