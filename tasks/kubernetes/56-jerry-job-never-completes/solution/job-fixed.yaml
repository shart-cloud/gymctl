apiVersion: batch/v1
kind: Job
metadata:
  name: jerry-batch
spec:
  completions: 6
  parallelism: 3
  completionMode: Indexed
  backoffLimit: 4
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: worker
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "Worker ${JOB_COMPLETION_INDEX} starting..."
          # Simulate processing the work item at this index
          sleep 5
          echo "Worker ${JOB_COMPLETION_INDEX} done."
