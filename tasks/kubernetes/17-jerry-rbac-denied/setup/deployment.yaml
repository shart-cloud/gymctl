apiVersion: apps/v1
kind: Deployment
metadata:
  name: jerry-rbac-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jerry-rbac-app
  template:
    metadata:
      labels:
        app: jerry-rbac-app
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
