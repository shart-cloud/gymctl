apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-test
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: network-test
  template:
    metadata:
      labels:
        app: network-test
    spec:
      containers:
      - name: nginx
        image: nginx:1.20
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi