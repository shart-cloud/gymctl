apiVersion: apps/v1
kind: Deployment
metadata:
  name: managed-vagrant-app
  labels:
    app: managed-vagrant-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: managed-vagrant-app
  template:
    metadata:
      labels:
        app: managed-vagrant-app
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
