apiVersion: apps/v1
kind: Deployment
metadata:
  name: jerry-scheduler-probe
  labels:
    app: jerry-scheduler-probe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jerry-scheduler-probe
  template:
    metadata:
      labels:
        app: jerry-scheduler-probe
    spec:
      containers:
      - name: app
        image: registry.k8s.io/pause:3.10
