apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jerry-route
  namespace: default
spec:
  hostnames:
    - jerry.lab.local
  parentRefs:
    - name: shared-gatway
      namespace: gateway-shared
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: jerry-route-svc
          port: 80
