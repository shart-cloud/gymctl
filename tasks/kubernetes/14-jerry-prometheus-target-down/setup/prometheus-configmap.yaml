apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: "jerry-exporter"
        static_configs:
          - targets:
              - metrics-exporter.default.svc.cluster.local:8080
