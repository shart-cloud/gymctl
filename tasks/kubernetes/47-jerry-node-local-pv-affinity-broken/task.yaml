apiVersion: gym.jerry.io/v1
kind: Exercise

metadata:
  name: jerry-node-local-pv-affinity-broken
  title: "Jerry's Local PV Is Stuck on a Cordoned Node"
  track: k8s-storage
  week: 5
  order: 13

spec:
  difficulty: advanced
  estimatedTime: 35m
  points: 160

  description: |
    Jerry set up a local PersistentVolume pinned to a specific worker node for
    low-latency storage. The PVC bound successfully. Then that worker was
    cordoned for maintenance and never uncordoned.

    Now every pod that mounts the PVC stays Pending forever. The scheduler
    can't place the pod anywhere — the only node that satisfies the PV's
    nodeAffinity is unavailable.

    Restore normal scheduling by making the target node schedulable again,
    or update the PV's nodeAffinity to point to an available node.

  learningOutcomes:
    - "Understand how local PV nodeAffinity constrains pod scheduling"
    - "Diagnose Pending pods caused by PVC binding combined with node unavailability"
    - "Resolve scheduling deadlock by restoring node availability"

  tags:
    - storage
    - local-pv
    - node-affinity
    - scheduling
    - troubleshooting
    - cka

  environment:
    type: kubernetes
    kubernetes:
      createCluster: true
      kindConfig: |
        kind: Cluster
        apiVersion: kind.x-k8s.io/v1alpha4
        nodes:
        - role: control-plane
        - role: worker
        - role: worker
      namespace: default
    customSetup:
      - type: script
        timeout: 180s
        script: |
          set -e

          WORKER1=$(kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.metadata.labels.node-role\.kubernetes\.io/control-plane}{"\n"}{end}' | awk '$2=="" {print $1}' | head -1)
          WORKER2=$(kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.metadata.labels.node-role\.kubernetes\.io/control-plane}{"\n"}{end}' | awk '$2=="" {print $1}' | tail -1)

          docker exec "$WORKER1" mkdir -p /mnt/local-storage/vol1

          kubectl apply -f - <<MANIFEST
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: local-storage
          provisioner: kubernetes.io/no-provisioner
          volumeBindingMode: Immediate
          MANIFEST

          cat <<MANIFEST | kubectl apply -f -
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: jerry-local-pv
            labels:
              jerry.gym/pv: local-target
          spec:
            capacity:
              storage: 5Gi
            accessModes:
            - ReadWriteOnce
            persistentVolumeReclaimPolicy: Retain
            storageClassName: local-storage
            local:
              path: /mnt/local-storage/vol1
            nodeAffinity:
              required:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                    - ${WORKER1}
          MANIFEST

          kubectl apply -f - <<'MANIFEST'
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: jerry-local-claim
          spec:
            accessModes:
            - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi
            storageClassName: local-storage
            volumeName: jerry-local-pv
          MANIFEST

          for i in $(seq 1 60); do
            phase=$(kubectl get pvc jerry-local-claim -o jsonpath='{.status.phase}' 2>/dev/null || true)
            if [ "$phase" = "Bound" ]; then break; fi
            sleep 2
          done

          kubectl cordon "$WORKER1"
          kubectl label node "$WORKER1" jerry.gym/role=cordoned-target --overwrite
          kubectl label node "$WORKER2" jerry.gym/role=available-worker --overwrite

          kubectl apply -f - <<'MANIFEST'
          apiVersion: v1
          kind: Pod
          metadata:
            name: jerry-local-app
            labels:
              app: jerry-local-app
          spec:
            containers:
            - name: app
              image: busybox:1.36
              command: ["sh", "-c", "echo running && sleep 3600"]
              volumeMounts:
              - name: local-data
                mountPath: /data
            volumes:
            - name: local-data
              persistentVolumeClaim:
                claimName: jerry-local-claim
          MANIFEST

  checks:
    - name: "PVC is Bound"
      type: script
      script: |
        set -e
        phase=$(kubectl get pvc jerry-local-claim -o jsonpath='{.status.phase}' 2>/dev/null || true)
        [ "$phase" = "Bound" ] || { echo "FAIL: PVC phase is '$phase'"; exit 1; }
      expectExitCode: 0

    - name: "Pod reaches Running"
      type: script
      script: |
        set -e
        for i in $(seq 1 90); do
          phase=$(kubectl get pod jerry-local-app -o jsonpath='{.status.phase}' 2>/dev/null || true)
          if [ "$phase" = "Running" ]; then exit 0; fi
          sleep 3
        done
        echo "FAIL: pod phase=$(kubectl get pod jerry-local-app -o jsonpath='{.status.phase}' 2>/dev/null || true)"
        kubectl describe pod jerry-local-app | tail -20 || true
        exit 1
      expectExitCode: 0

    - name: "Pod can write to the local volume"
      type: script
      script: |
        set -e
        kubectl exec jerry-local-app -- sh -c 'echo local-pv-works > /data/probe && cat /data/probe'
      expectExitCode: 0

  hints:
    - cost: 0
      file: hints/hint-1.md
    - cost: 25
      file: hints/hint-2.md
    - cost: 50
      file: hints/hint-3.md

  successMessage: |
    Pod scheduled and local volume accessible.

    **Key takeaway:** local PVs are fundamentally tied to a specific node through
    nodeAffinity. If that node is unavailable, pods that require the PV cannot
    schedule anywhere else — there is no failover. This is the core trade-off of
    local storage: lower latency but no portability. In production, local PVs
    require careful node lifecycle management.
